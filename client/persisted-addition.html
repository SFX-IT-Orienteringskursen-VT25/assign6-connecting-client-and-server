<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add and Summarize Numbers</title>
  </head>
  <body>
    <div class="container">
      <h1>Add a Number and Summarize Them</h1>
      <p>
        Enter a number below. The calculator will correctly summarize the
        numbers.
      </p>
      <p><strong>Bonus improvement:</strong> Prevents adding invalid inputs.</p>

      <input type="text" id="numberInput" placeholder="Enter an integer" />
      <button id="addButton">Add Number</button>

      <div class="list">
        <div id="numberList"></div>
        =
        <h3><span id="totalSum">0</span></h3>
      </div>
    </div>

    <script type="module">
      import { postNumber } from "./postNumber.js";
      import { getNumbers } from "./getNumbers.js";
      import { getSum } from "./getSum.js";

      const numberInput = document.getElementById("numberInput");
      const addButton = document.getElementById("addButton");
      const numberList = document.getElementById("numberList");
      const totalSum = document.getElementById("totalSum");

      window.onload = async function () {
        let data = await getNumbers();
        let savedNumbers = data.savedNumbers;
        if (savedNumbers.length > 0) {
          numberList.textContent = savedNumbers.join(" + ");
        }

        totalSum.textContent = getSum(savedNumbers);
      };

      addButton.addEventListener("click", async function () {
        const number = numberInput.value.trim();

        // Check if input is a valid integer (no decimals, no empty input)
        if (!/^-?\d+$/.test(number)) {
          alert("Please enter a valid integer.");
        } else {
          const numValue = parseInt(number, 10);
          let data = await postNumber(numValue);
          let savedNumbers = data.savedNumbers;
          numberList.textContent = savedNumbers.join(" + ");
          totalSum.textContent = getSum(savedNumbers);
        }

        numberInput.value = "";
        numberInput.focus();
      });
    </script>
  </body>
</html>
